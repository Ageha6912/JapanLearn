<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">JapanLearn — 日语学习 Android App</title>
  <desc id="hero-desc">JapanLearn：面向 N5 初学者的离线日语学习 App，每天 5 到 15 分钟完成学习、练习、间隔复习的闭环。</desc>

  <defs>
    <linearGradient id="washi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F6F1"/>
      <stop offset="1" stop-color="#F1EDE4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="26" fill="url(#washi)"/>

  <!-- 左侧：标题区 -->
  <g transform="translate(64 52)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#57524B" letter-spacing="2">ANDROID · KOTLIN · COMPOSE — 完全离线 · 本地优先</text>
    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="64" font-weight="800" fill="#1B3A5C">JapanLearn<tspan fill="#C75B5B">。</tspan></text>
    <text x="2" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="24" fill="#3E6489">五十音 → N5 单词语法 → 间隔复习，每天 5–15 分钟</text>
    <text x="2" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19" fill="#57524B">不依赖网络与账号：内容打包进 APK，学习数据存在本机 Room。</text>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#1B3A5C">
      <rect x="2" y="182" width="150" height="38" rx="19" fill="none" stroke="#1B3A5C" stroke-opacity="0.35" stroke-width="1.5"/>
      <text x="77" y="207" text-anchor="middle">SRS 间隔复习</text>
      <rect x="164" y="182" width="150" height="38" rx="19" fill="none" stroke="#1B3A5C" stroke-opacity="0.35" stroke-width="1.5"/>
      <text x="239" y="207" text-anchor="middle">错题本自动收录</text>
      <rect x="326" y="182" width="150" height="38" rx="19" fill="none" stroke="#1B3A5C" stroke-opacity="0.35" stroke-width="1.5"/>
      <text x="401" y="207" text-anchor="middle">46 项单元测试</text>
    </g>
  </g>

  <!-- 右侧：项目原生材料——首页任务卡 + 五十音瓷砖 -->
  <g transform="translate(742 44)">
    <!-- 阴影 -->
    <rect x="10" y="14" width="300" height="252" rx="20" fill="#1B3A5C" fill-opacity="0.10"/>
    <!-- 今日学习卡片（应用首页的真实结构） -->
    <rect width="300" height="252" rx="20" fill="#FFFFFF"/>
    <text x="24" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" font-weight="700" fill="#1C1B1A">今日学习</text>
    <text x="276" y="44" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17" font-weight="700" fill="#C75B5B">🔥 7 天</text>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#57524B">
      <text x="24" y="84">新词</text><text x="276" y="84" text-anchor="end" font-weight="700" fill="#1C1B1A">10 个</text>
      <text x="24" y="114">语法</text><text x="276" y="114" text-anchor="end" font-weight="700" fill="#1C1B1A">3 条</text>
      <text x="24" y="144">待复习</text><text x="276" y="144" text-anchor="end" font-weight="700" fill="#1C1B1A">25 条</text>
    </g>

    <rect x="24" y="166" width="252" height="10" rx="5" fill="#F7DEDE"/>
    <rect x="24" y="166" width="176" height="10" rx="5" fill="#C75B5B"/>
    <text x="24" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" fill="#57524B">今日已完成 5 / 13 项</text>

    <rect x="24" y="212" width="252" height="24" rx="8" fill="#F2F0EA"/>
    <text x="150" y="229" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#1B3A5C">[ 开始今日学习 ]</text>

    <!-- 五十音瓷砖：motif -->
    <g transform="translate(330 0)" font-family="-apple-system, 'PingFang SC', sans-serif">
      <rect x="0" y="0" width="52" height="52" rx="12" fill="#FFFFFF"/><text x="26" y="36" text-anchor="middle" font-size="26" fill="#1B3A5C">あ</text>
      <rect x="60" y="0" width="52" height="52" rx="12" fill="#FFFFFF"/><text x="86" y="36" text-anchor="middle" font-size="26" fill="#1B3A5C">い</text>
      <rect x="0" y="60" width="52" height="52" rx="12" fill="#FFFFFF"/><text x="26" y="96" text-anchor="middle" font-size="26" fill="#1B3A5C">か</text>
      <rect x="60" y="60" width="52" height="52" rx="12" fill="#C75B5B"/><text x="86" y="96" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">き</text>
      <rect x="0" y="120" width="52" height="52" rx="12" fill="#FFFFFF"/><text x="26" y="156" text-anchor="middle" font-size="26" fill="#1B3A5C">さ</text>
      <rect x="60" y="120" width="52" height="52" rx="12" fill="#FFFFFF"/><text x="86" y="156" text-anchor="middle" font-size="26" fill="#1B3A5C">し</text>
      <text x="0" y="212" font-size="17" fill="#57524B">平假名 · 片假名</text>
      <text x="0" y="238" font-size="17" fill="#57524B">46 组全覆盖</text>
    </g>
  </g>
</svg>
